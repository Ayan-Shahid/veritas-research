name: CI/CD

# Pull requests only run the test jobs. A push to main also builds and pushes images to
# ghcr.io, deploys them on the self-hosted runner (the MacBook), then prunes old image
# versions. See deploy/README.md's "CI/CD" section for the one-time setup this depends on:
# the self-hosted runner, and the DOMAIN/ANON_KEY repo variable+secret used to build the
# frontend image (Next.js inlines NEXT_PUBLIC_* values at build time, so they can't just
# live in deploy/.env the way the rest of the secrets do).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veritas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d veritas"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: "Install dependencies (skips sentence-transformers/torch: heavy, not needed by these tests)"
        run: |
          grep -v '^sentence-transformers' requirements.txt > /tmp/requirements.ci.txt
          pip install -r /tmp/requirements.ci.txt
      - name: "Create app role (normally deploy/initdb/01-bootstrap.sh's job; this service
          container has no initdb mount, so the same three statements run by hand here)"
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d veritas -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h localhost -U postgres -d veritas -c "CREATE ROLE veritas LOGIN PASSWORD 'veritas';"
          psql -h localhost -U postgres -d veritas -c "ALTER DATABASE veritas OWNER TO veritas;"
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://veritas:veritas@localhost:5432/veritas
      - run: pytest
        env:
          DATABASE_URL: postgresql+asyncpg://veritas:veritas@localhost:5432/veritas
          REDIS_URL: redis://localhost:6379/0
          SUPABASE_JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789
          SUPABASE_URL: ""
          SECRET_KEY: ci-only-secret-key-0123456789

  build-and-push:
    needs: [test-frontend, test-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase image names (GHCR requires lowercase)
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/$owner/veritas-backend" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/$owner/veritas-web" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push web
        # NEXT_PUBLIC_* values are baked in at build time, so they're supplied here, not at
        # deploy time. DOMAIN is a repo *variable* (not secret); ANON_KEY is a repo *secret*
        # purely to keep it out of logs, even though Supabase's anon key is meant to be
        # public-safe. Both must match the values in deploy/.env on the Mac — see the
        # deploy/README.md CI/CD section for how to set them and what happens if they drift.
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://${{ vars.DOMAIN }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.ANON_KEY }}
            NEXT_PUBLIC_API_URL=https://${{ vars.DOMAIN }}/api
            NEXT_PUBLIC_SITE_URL=https://${{ vars.DOMAIN }}
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: production
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and restart
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: bash deploy/deploy.sh

  prune:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        package: [veritas-backend, veritas-web]
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 10
